name: Build and Test

on:
  push:
    branches: [ main, develop, nawglan.upgrade ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          6.0.x
          8.0.x
        
    - name: Restore dependencies
      run: dotnet restore sims4tools.sln
      
    - name: Build
      run: dotnet build sims4tools.sln --configuration Release --no-restore
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: sims4tools-windows
        path: |
          s4pe/bin/Release/
          !s4pe/bin/Release/**/*.pdb

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          6.0.x
          8.0.x
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mono-devel
        
    - name: Restore dependencies
      run: dotnet restore sims4tools.sln
      
    - name: Build
      run: dotnet build sims4tools.sln --configuration Release --no-restore
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: sims4tools-linux
        path: |
          s4pe/bin/Release/

  build-macos:
    if: false
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          6.0.x
          8.0.x
        
    - name: Restore dependencies
      run: dotnet restore sims4tools.sln
      
    - name: Build
      run: dotnet build sims4tools.sln --configuration Release --no-restore
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: sims4tools-macos
        path: |
          s4pe/bin/Release/
